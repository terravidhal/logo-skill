<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 840" role="img" aria-label="Before and after: one blurry PNG versus the complete logodeck family">
  <defs>
    <path id="seed" fill-rule="evenodd" d="M128 24C186 24 228 76 228 134C228 194 184 232 128 232C72 232 28 194 28 134C28 76 70 24 128 24ZM120 190L120 142C104 142 92 132 88 116C106 112 120 124 126 138C132 118 148 108 166 112C162 130 148 142 134 142L134 190Z"/>
    <path id="seed-small" fill-rule="evenodd" d="M128 24C186 24 228 76 228 134C228 194 184 232 128 232C72 232 28 194 28 134C28 76 70 24 128 24ZM116 192L116 140C99 140 85 127 80 111C102 107 116 121 122 138C128 116 147 105 168 109C164 130 149 143 134 143L134 192Z"/>
    <symbol id="mark" viewBox="28 24 200 208"><use href="#seed"/></symbol>
    <symbol id="mark-small" viewBox="28 24 200 208"><use href="#seed-small"/></symbol>
    <symbol id="word" viewBox="0 12 334 88">
      <g>
        <rect x="0" y="12" width="14" height="88" rx="7"/>
        <rect x="0" y="86" width="58" height="14" rx="7"/>
        <path fill-rule="evenodd" d="M104 44C119.464 44 132 56.536 132 72C132 87.464 119.464 100 104 100C88.536 100 76 87.464 76 72C76 56.536 88.536 44 104 44ZM104 58C111.732 58 118 64.268 118 72C118 79.732 111.732 86 104 86C96.268 86 90 79.732 90 72C90 64.268 96.268 58 104 58Z"/>
        <path fill-rule="evenodd" d="M178 44C193.464 44 206 56.536 206 72C206 87.464 193.464 100 178 100C162.536 100 150 87.464 150 72C150 56.536 162.536 44 178 44ZM178 58C185.732 58 192 64.268 192 72C192 79.732 185.732 86 178 86C170.268 86 164 79.732 164 72C164 64.268 170.268 58 178 58Z"/>
        <rect x="200" y="44" width="14" height="56" rx="7"/>
        <rect x="232" y="44" width="14" height="56" rx="7"/>
        <rect x="276" y="44" width="14" height="56" rx="7"/>
        <rect x="320" y="44" width="14" height="56" rx="7"/>
        <rect x="232" y="44" width="58" height="14" rx="7"/>
        <rect x="276" y="44" width="58" height="14" rx="7"/>
      </g>
    </symbol>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
      .label { font-size: 13px; letter-spacing: .14em; font-weight: 700; }
      .note { font-size: 15px; }
      .small { font-size: 12px; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </defs>

  <rect width="1400" height="840" fill="#F6F4EC"/>
  <text x="52" y="62" font-size="30" font-weight="700" letter-spacing="-.02em" fill="#16241D">Loam — before / after</text>
  <text x="52" y="88" font-size="15" fill="#5C6B62">The same brand, one raster file versus a complete, reproducible deck.</text>

  <!-- BEFORE -->
  <g>
    <rect x="48" y="120" width="630" height="620" rx="28" fill="#E8E2D6"/>
    <text x="80" y="160" class="label" fill="#8A3B22">BEFORE</text>
    <text x="80" y="184" font-size="14" fill="#7A6A5F">One 512 px PNG, no source.</text>

    <g filter="url(#blur)" opacity=".82">
      <circle cx="362" cy="342" r="112" fill="#2F6B3E"/>
      <path d="M362 262c34 12 54 48 46 84-8 38-44 62-82 54-14-30-10-70 12-98 8-10 16-22 24-40Z" fill="#D8E7C8"/>
      <text x="362" y="512" text-anchor="middle" font-size="72" font-weight="700" fill="#2F6B3E">loam</text>
    </g>
    <rect x="236" y="540" width="252" height="62" rx="10" fill="#FFFFFF" opacity=".55"/>
    <text x="362" y="580" text-anchor="middle" class="small" fill="#6B5C52">PNG, upscaled from 512 px</text>

    <g>
      <circle cx="362" cy="664" r="26" fill="none" stroke="#B4452A" stroke-width="2" stroke-dasharray="5 5"/>
      <rect x="350" y="652" width="24" height="24" rx="4" fill="#2F6B3E"/>
      <circle cx="362" cy="664" r="4" fill="#D8E7C8"/>
      <text x="402" y="670" class="small" fill="#8A3B22">favicon: unrecognisable</text>
    </g>

    <g class="note" fill="#4C3D33">
      <text x="80" y="212">• one raster file, no editable source</text>
      <text x="80" y="238">• no mono version</text>
      <text x="80" y="264">• no dedicated dark version</text>
      <text x="80" y="290">• wordmark depends on the font</text>
      <text x="80" y="316">• no app icon, no React component</text>
    </g>
  </g>

  <!-- AFTER -->
  <g>
    <rect x="722" y="120" width="630" height="620" rx="28" fill="#FFFFFF"/>
    <rect x="722" y="120" width="630" height="620" rx="28" fill="none" stroke="#16241D" stroke-opacity=".08"/>
    <text x="754" y="160" class="label" fill="#1F6F4A">AFTER</text>
    <text x="754" y="184" font-size="14" fill="#5C6B62">One manifest, two masters, 19 files.</text>

    <!-- horizontal lockup -->
    <use href="#mark" x="754" y="210" width="96" height="100" fill="#1F6F4A"/>
    <use href="#word" x="872" y="238" width="208" height="55" fill="#16241D"/>

    <g>
      <!-- symbol -->
      <rect x="754" y="350" width="150" height="130" rx="16" fill="#F6F4EC"/>
      <use href="#mark" x="789" y="365" width="80" height="100" fill="#1F6F4A"/>
      <text x="829" y="502" text-anchor="middle" class="small" fill="#5C6B62">symbol</text>

      <!-- mono -->
      <rect x="920" y="350" width="150" height="130" rx="16" fill="#F6F4EC"/>
      <use href="#mark" x="955" y="365" width="80" height="100" fill="#16241D"/>
      <text x="995" y="502" text-anchor="middle" class="small" fill="#5C6B62">mono</text>

      <!-- dark -->
      <rect x="1086" y="350" width="234" height="130" rx="16" fill="#101A16"/>
      <use href="#mark" x="1114" y="365" width="80" height="100" fill="#64C79A"/>
      <use href="#word" x="1210" y="385" width="88" height="24" fill="#EAF2EC"/>
      <text x="1203" y="502" text-anchor="middle" class="small" fill="#9FB3A8">dark</text>

      <!-- favicon -->
      <rect x="754" y="526" width="150" height="130" rx="16" fill="#F6F4EC"/>
      <rect x="787" y="562" width="56" height="56" rx="13" fill="#1F6F4A"/>
      <use href="#mark-small" x="797" y="568" width="36" height="44" fill="#F6F4EC"/>
      <rect x="855" y="580" width="32" height="32" rx="8" fill="#1F6F4A"/>
      <use href="#mark-small" x="861" y="583" width="20" height="26" fill="#F6F4EC"/>
      <rect x="895" y="590" width="16" height="16" rx="4" fill="#1F6F4A"/>
      <use href="#mark-small" x="898" y="592" width="10" height="12" fill="#F6F4EC"/>
      <text x="829" y="646" text-anchor="middle" class="small" fill="#5C6B62">favicon 64 / 32 / 16</text>

      <!-- app icon -->
      <rect x="920" y="526" width="150" height="130" rx="16" fill="#F6F4EC"/>
      <rect x="959" y="546" width="72" height="72" rx="16" fill="#1F6F4A"/>
      <use href="#mark" x="973" y="553" width="44" height="58" fill="#F6F4EC"/>
      <text x="995" y="646" text-anchor="middle" class="small" fill="#5C6B62">app icon</text>

      <!-- stacked -->
      <rect x="1086" y="526" width="234" height="130" rx="16" fill="#F6F4EC"/>
      <use href="#mark" x="1178" y="540" width="50" height="52" fill="#1F6F4A"/>
      <use href="#word" x="1144" y="602" width="118" height="31" fill="#16241D"/>
      <text x="1203" y="646" text-anchor="middle" class="small" fill="#5C6B62">stacked lockup</text>
    </g>

    <g class="note" fill="#33463B">
      <text x="754" y="700">15 SVG + tokens + CSS + preview + typed React component</text>
      <text x="754" y="724">Change one CSS variable; every themed file follows.</text>
    </g>
  </g>

  <text x="52" y="798" class="mono" font-size="12" fill="#6B7A70">npx skills add terravidhal/logodeck</text>
  <text x="1348" y="798" text-anchor="end" class="small" fill="#6B7A70">MIT · no third-party marks</text>
</svg>
