<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 940" role="img" aria-label="The logodeck family: symbol, mono, dark, wordmark, lockups, favicon, app icon, tokens and React component">
  <defs>
    <path id="seed" fill-rule="evenodd" d="M128 24C186 24 228 76 228 134C228 194 184 232 128 232C72 232 28 194 28 134C28 76 70 24 128 24ZM120 190L120 142C104 142 92 132 88 116C106 112 120 124 126 138C132 118 148 108 166 112C162 130 148 142 134 142L134 190Z"/>
    <path id="seed-small" fill-rule="evenodd" d="M128 24C186 24 228 76 228 134C228 194 184 232 128 232C72 232 28 194 28 134C28 76 70 24 128 24ZM116 192L116 140C99 140 85 127 80 111C102 107 116 121 122 138C128 116 147 105 168 109C164 130 149 143 134 143L134 192Z"/>
    <symbol id="mark" viewBox="28 24 200 208"><use href="#seed"/></symbol>
    <symbol id="mark-small" viewBox="28 24 200 208"><use href="#seed-small"/></symbol>
    <g id="word-art">
        <rect x="0" y="12" width="14" height="88" rx="7"/>
        <rect x="0" y="86" width="58" height="14" rx="7"/>
        <path fill-rule="evenodd" d="M104 44C119.464 44 132 56.536 132 72C132 87.464 119.464 100 104 100C88.536 100 76 87.464 76 72C76 56.536 88.536 44 104 44ZM104 58C111.732 58 118 64.268 118 72C118 79.732 111.732 86 104 86C96.268 86 90 79.732 90 72C90 64.268 96.268 58 104 58Z"/>
        <path fill-rule="evenodd" d="M178 44C193.464 44 206 56.536 206 72C206 87.464 193.464 100 178 100C162.536 100 150 87.464 150 72C150 56.536 162.536 44 178 44ZM178 58C185.732 58 192 64.268 192 72C192 79.732 185.732 86 178 86C170.268 86 164 79.732 164 72C164 64.268 170.268 58 178 58Z"/>
        <rect x="200" y="44" width="14" height="56" rx="7"/>
        <rect x="232" y="44" width="14" height="56" rx="7"/>
        <rect x="276" y="44" width="14" height="56" rx="7"/>
        <rect x="320" y="44" width="14" height="56" rx="7"/>
        <rect x="232" y="44" width="58" height="14" rx="7"/>
        <rect x="276" y="44" width="58" height="14" rx="7"/>
    </g>
    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
      .label { font-size: 12px; letter-spacing: .16em; font-weight: 700; }
      .small { font-size: 13px; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .cardtitle { font-size: 15px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1400" height="940" fill="#F6F4EC"/>
  <text x="52" y="64" font-size="30" font-weight="700" letter-spacing="-.02em" fill="#16241D">The deck</text>
  <text x="52" y="90" font-size="15" fill="#5C6B62">15 SVG, two modes, one palette, one typed component. All from a single manifest.</text>

  <!-- hero card -->
  <rect x="48" y="122" width="620" height="360" rx="26" fill="#FFFFFF"/>
  <rect x="48" y="122" width="620" height="360" rx="26" fill="none" stroke="#16241D" stroke-opacity=".08"/>
  <text x="80" y="160" class="label" fill="#1F6F4A">PRIMARY SIGNATURE</text>
  <use href="#mark" x="80" y="196" width="130" height="135" fill="#1F6F4A"/>
  <svg x="238" y="238" width="284" height="75" viewBox="0 12 334 88"><use href="#word-art" fill="#16241D"/></svg>
  <rect x="80" y="356" width="556" height="1" fill="#16241D" opacity=".08"/>
  <text x="80" y="392" class="small" fill="#5C6B62">The horizontal lockup is composed from the two masters with one gap module.</text>
  <text x="80" y="416" class="small" fill="#5C6B62">No variant is drawn twice; no file can drift from the source.</text>
  <use href="#mark" x="80" y="436" width="26" height="27" fill="#1F6F4A"/>
  <text x="120" y="456" class="mono" font-size="12" fill="#5C6B62">lockup-horizontal.svg (+mono, +dark)</text>

  <!-- stacked card -->
  <rect x="692" y="122" width="300" height="360" rx="26" fill="#FFFFFF"/>
  <rect x="692" y="122" width="300" height="360" rx="26" fill="none" stroke="#16241D" stroke-opacity=".08"/>
  <text x="720" y="160" class="label" fill="#1F6F4A">STACKED</text>
  <use href="#mark" x="796" y="192" width="92" height="96" fill="#1F6F4A"/>
  <svg x="748" y="312" width="212" height="56" viewBox="0 12 334 88"><use href="#word-art" fill="#16241D"/></svg>
  <text x="720" y="404" class="small" fill="#5C6B62">Square formats, avatars,</text>
  <text x="720" y="426" class="small" fill="#5C6B62">covers and packaging.</text>

  <!-- palette card -->
  <rect x="1016" y="122" width="336" height="360" rx="26" fill="#FFFFFF"/>
  <rect x="1016" y="122" width="336" height="360" rx="26" fill="none" stroke="#16241D" stroke-opacity=".08"/>
  <text x="1044" y="160" class="label" fill="#1F6F4A">PALETTE</text>
  <text x="1044" y="190" class="cardtitle" fill="#16241D">moss-clay</text>
  <rect x="1044" y="210" width="66" height="66" rx="12" fill="#1F6F4A"/>
  <rect x="1118" y="210" width="66" height="66" rx="12" fill="#C2542D"/>
  <rect x="1192" y="210" width="66" height="66" rx="12" fill="#16241D"/>
  <rect x="1266" y="210" width="58" height="66" rx="12" fill="#F6F4EC" stroke="#16241D" stroke-opacity=".12"/>
  <text x="1044" y="302" class="small" fill="#5C6B62">brand 5.56:1</text>
  <text x="1118" y="302" class="small" fill="#5C6B62">accent 4.15:1</text>
  <text x="1192" y="302" class="small" fill="#5C6B62">ink 14.62:1</text>
  <text x="1044" y="330" class="small" fill="#5C6B62">One line changes every themed file:</text>
  <rect x="1044" y="344" width="280" height="38" rx="9" fill="#101A16"/>
  <text x="1058" y="368" class="mono" font-size="12" fill="#9FE3C1">--ld-brand: #1F6F4A;</text>

  <!-- row 2 -->
  <g>
    <!-- symbol -->
    <rect x="48" y="510" width="200" height="190" rx="22" fill="#FFFFFF"/>
    <text x="72" y="544" class="label" fill="#5C6B62">SYMBOL</text>
    <use href="#mark" x="94" y="560" width="106" height="110" fill="#1F6F4A"/>
    <text x="72" y="682" class="small" fill="#5C6B62">themed</text>

    <!-- mono -->
    <rect x="264" y="510" width="200" height="190" rx="22" fill="#FFFFFF"/>
    <text x="288" y="544" class="label" fill="#5C6B62">MONO</text>
    <use href="#mark" x="310" y="560" width="106" height="110" fill="#16241D"/>
    <text x="288" y="682" class="small" fill="#5C6B62">currentColor</text>

    <!-- dark -->
    <rect x="480" y="510" width="200" height="190" rx="22" fill="#101A16"/>
    <text x="504" y="544" class="label" fill="#9FB3A8">DARK</text>
    <use href="#mark" x="526" y="560" width="106" height="110" fill="#64C79A"/>
    <text x="504" y="682" class="small" fill="#9FB3A8">dedicated colours</text>

    <!-- wordmark -->
    <rect x="696" y="510" width="296" height="190" rx="22" fill="#FFFFFF"/>
    <text x="720" y="544" class="label" fill="#5C6B62">WORDMARK</text>
    <svg x="740" y="590" width="208" height="55" viewBox="0 12 334 88"><use href="#word-art" fill="#16241D"/></svg>
    <text x="720" y="682" class="small" fill="#5C6B62">paths, never text</text>

    <!-- favicon -->
    <rect x="1008" y="510" width="160" height="190" rx="22" fill="#FFFFFF"/>
    <text x="1032" y="544" class="label" fill="#5C6B62">FAVICON</text>
    <rect x="1032" y="562" width="50" height="50" rx="12" fill="#1F6F4A"/>
    <use href="#mark-small" x="1041" y="567" width="32" height="40" fill="#F6F4EC"/>
    <rect x="1092" y="570" width="32" height="32" rx="8" fill="#1F6F4A"/>
    <use href="#mark-small" x="1098" y="573" width="20" height="26" fill="#F6F4EC"/>
    <rect x="1132" y="580" width="16" height="16" rx="4" fill="#1F6F4A"/>
    <use href="#mark-small" x="1135" y="582" width="10" height="12" fill="#F6F4EC"/>
    <text x="1032" y="682" class="small" fill="#5C6B62">64 / 32 / 16</text>

    <!-- app icon -->
    <rect x="1184" y="510" width="168" height="190" rx="22" fill="#FFFFFF"/>
    <text x="1208" y="544" class="label" fill="#5C6B62">APP ICON</text>
    <rect x="1218" y="562" width="78" height="78" rx="18" fill="#1F6F4A"/>
    <use href="#mark" x="1233" y="570" width="48" height="63" fill="#F6F4EC"/>
    <text x="1208" y="682" class="small" fill="#5C6B62">+ maskable</text>
  </g>

  <!-- row 3 -->
  <rect x="48" y="728" width="620" height="160" rx="22" fill="#101A16"/>
  <text x="76" y="764" class="label" fill="#9FB3A8">REACT</text>
  <text x="76" y="798" class="mono" font-size="13" fill="#EAF2EC">&lt;LoamLogo type="horizontal" mode="auto" title="Loam" /&gt;</text>
  <text x="76" y="824" class="mono" font-size="13" fill="#9FE3C1">variant="color" | "mono"</text>
  <text x="76" y="848" class="mono" font-size="13" fill="#9FE3C1">type="icon" | "wordmark" | "horizontal" | "stacked"</text>
  <text x="76" y="872" class="small" fill="#9FB3A8">No Tailwind. No CSS import. React only.</text>

  <rect x="692" y="728" width="660" height="160" rx="22" fill="#FFFFFF"/>
  <text x="720" y="764" class="label" fill="#5C6B62">FILES</text>
  <text x="720" y="792" class="small" fill="#33463B">symbol · symbol-mono · symbol-dark · wordmark · wordmark-mono · wordmark-dark</text>
  <text x="720" y="816" class="small" fill="#33463B">lockup-horizontal (+mono, +dark) · lockup-stacked (+mono, +dark)</text>
  <text x="720" y="840" class="small" fill="#33463B">favicon · app-icon · app-icon-maskable · tokens.json · palette.css · preview.html</text>
  <text x="720" y="868" class="mono" font-size="12" fill="#1F6F4A">npx skills add terravidhal/logodeck</text>
</svg>
